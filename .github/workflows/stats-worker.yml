name: Посредник статистики на Cloudflare

# Загружает stats-worker/worker.js в Cloudflare Worker kurier-pdd-stats: на iPhone вставить код
# в редактор Cloudflare не получается. Заодно создаёт хранилище Workers KV kurier-pdd-duels для итогов
# дуэлей и подключает его к посреднику как DUELS, комнаты дуэли в реальном времени — как LIVE
# (Durable Object LiveRoom), игроков для таблицы лидеров — как PLAYERS (Durable Object Players);
# бесплатный тариф Workers их поддерживает. Нужен секрет репозитория CLOUDFLARE_API_TOKEN
# (Cloudflare → профиль → API Tokens → шаблон «Edit Cloudflare Workers»). Секреты самого
# посредника (GC_TOKEN, STATS_KEY) задаются в Cloudflare и при загрузке кода не меняются.

on:
  push:
    branches: [main]
    paths: ['stats-worker/**', '.github/workflows/stats-worker.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stats-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Загрузить посредника в Cloudflare
        working-directory: stats-worker
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::Нет секрета CLOUDFLARE_API_TOKEN — посредник не загружен. Добавьте его в Settings → Secrets and variables → Actions."
            exit 0
          fi
          export CLOUDFLARE_API_TOKEN="$TOKEN"
          # Номер аккаунта нужен, только если у ключа доступ к нескольким аккаунтам Cloudflare.
          if [ -n "$ACCOUNT" ]; then export CLOUDFLARE_ACCOUNT_ID="$ACCOUNT"; fi
          # Хранилище итогов дуэлей (Workers KV): найти, а если его нет — создать.
          list() { npx --yes wrangler@4 kv namespace list 2>/dev/null | node kv-config.mjs id; }
          ID=$(list || true)
          if [ -z "$ID" ]; then
            npx --yes wrangler@4 kv namespace create kurier-pdd-duels || true
            ID=$(list || true)
          fi
          if [ -z "$ID" ]; then
            echo "::warning::Не удалось найти или создать хранилище Workers KV для дуэлей — у ключа CLOUDFLARE_API_TOKEN нет права «Workers KV Storage: Edit»? Посредник загружен без итогов дуэлей."
          fi
          # Сначала — с комнатами дуэли и таблицей лидеров (Durable Objects LiveRoom и Players). Если Cloudflare их
          # не принял, загрузить без них: статистика и дуэли по ссылке должны работать в любом случае.
          DUELS_KV_ID="$ID" node kv-config.mjs config
          if ! npx --yes wrangler@4 deploy --config wrangler.deploy.json; then
            echo "::warning::Cloudflare не принял комнаты дуэли и таблицу лидеров (Durable Objects). Посредник загружен без них: живая дуэль и таблица лидеров недоступны, остальное работает."
            DUELS_KV_ID="$ID" node kv-config.mjs config --no-live
            npx --yes wrangler@4 deploy --config wrangler.deploy.json
          fi
